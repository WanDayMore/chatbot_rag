<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Chatbot - Localhost Test Client</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: #1e293b;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: #38bdf8; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      background: #334155;
      color: #94a3b8;
      margin-bottom: 1rem;
    }
    #chat-box {
      height: 380px;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      background: #0f172a;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.5;
      word-break: break-word;
      font-size: 0.95rem;
    }
    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }
    .msg.bot {
      align-self: flex-start;
      background: #334155;
      color: #f1f5f9;
      border-left: 3px solid #38bdf8;
    }
    .meta-tag {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #7dd3fc; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <h2>Portfolio Chatbot Local Tester</h2>
  <div class="badge">API Target: http://localhost:8000</div>

  <div id="chat-box">
    <div class="msg bot">
      Hi! I'm Isaiah's Portfolio AI Assistant. Ask me anything about skills, projects, or background!
    </div>
  </div>

  <div class="input-row">
    <input type="text" id="userInput" placeholder="Ask: What skills does Isaiah have?..." autofocus />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const chatBox = document.getElementById("chat-box");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !sendBtn.disabled) sendMessage();
  });

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    // Append user message
    appendMsg(text, "user");
    userInput.value = "";
    sendBtn.disabled = true;

    // Create empty bot placeholder for streaming
    const botMsgDiv = appendMsg("...", "bot");
    let accumulatedText = "";

    try {
      // Connect to SSE streaming endpoint
      const response = await fetch("http://localhost:8000/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({ detail: response.statusText }));
        const friendlyMessage = err.detail || "The assistant is temporarily unavailable. Please try again shortly!";
        botMsgDiv.textContent = friendlyMessage;
        botMsgDiv.style.borderLeftColor = "#f59e0b";
        sendBtn.disabled = false;
        return;
      }


      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      botMsgDiv.textContent = "";

      let isCached = false;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        const chunkText = decoder.decode(value);
        const lines = chunkText.split("\n");

        for (const line of lines) {
          if (line.startsWith("data: ")) {
            try {
              const data = JSON.parse(line.substring(6));
              if (data.chunk) {
                accumulatedText += data.chunk;
                botMsgDiv.textContent = accumulatedText;
                if (data.cached) isCached = true;
              }
              chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {}
          }
        }
      }

      if (isCached) {
        const tag = document.createElement("div");
        tag.className = "meta-tag";
        tag.textContent = "⚡ Served from Semantic Cache (<25ms, 0 Gemini tokens)";
        botMsgDiv.appendChild(tag);
      }

    } catch (err) {
      botMsgDiv.textContent = "Network error: " + err.message;
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  function appendMsg(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }
</script>

</body>
</html>
